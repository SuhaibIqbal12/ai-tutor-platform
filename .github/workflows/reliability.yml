name: Tutor reliability
on:
  pull_request:
  push:
    branches: [main, fix/tutor-rag-reliability, feat/tutor-frontend-redesign]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          BACKEND_URL: http://localhost:3001
